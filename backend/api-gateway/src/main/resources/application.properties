# ===============================
# = SERVER CONFIGURATION
# ===============================
spring.main.web-application-type=reactive
server.port=${SERVER_PORT:8888}
spring.application.name=api-gateway
app.api-prefix=/api/v1

# ===============================
# = SERVICE ROUTING (with environment variables)
# ===============================
spring.cloud.gateway.server.webflux.routes[0].id=auth_service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=${app.api-prefix}/identity/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=profile_service
spring.cloud.gateway.server.webflux.routes[1].uri=${PROFILE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=${app.api-prefix}/profile/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

# ===============================
# = CORS CONFIGURATION
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://rescue-net-tan.vercel.app}

