# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/auth
app.services.profile=${PROFILE_SERVICE_URL:http://localhost:8888/api/v1/profile}
