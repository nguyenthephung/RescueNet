
# = DATABASE CONFIGURATION (with environment variables)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:RescureNet}${DB_PARAMS:}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# ===============================
# = JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================
# = JWT CONFIGURATION
# ===============================
jwt.signerKey=${JWT_SIGNER_KEY:R3WCR9EDLLJSWqNOdxcX5lAMMOlmZEBM4Hf6h1lDZpdxjYUZRyTrQNHJxk1CVYLRksHCpjtOTfslbVLwCQMVdwFcz5FoTPDAP6yaxZkWtdLB5xxcTo7YQSoGpcSxN7Sdqr}

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/identity
app.services.profile=${PROFILE_SERVICE_URL:http://localhost:8888/api/v1/profile}
jwt.valid-duration:60
jwt.refreshable-duration: 120
# ===============================
# = CORS CONFIGURATION
# ===============================
# CORS is handled by API Gateway in production
# But we add it here for direct access during development
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://rescue-net-tan.vercel.app}

# ===============================
# = EMAIL CONFIGURATION
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.debug=true
logging.level.com.example.demo.service.EmailService=DEBUG
logging.level.org.springframework.mail=DEBUG

# ===============================
# = SCHEDULING CONFIGURATION
# ===============================
spring.task.scheduling.pool.size=2

# ===============================
# = KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=userRegistered:com.rescuenet.events.UserRegisteredEvent
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Application name for correlation
spring.application.name=auth-service


