spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/RescueNet
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto-create tables if not exist
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

auth:
  introspect-url: http://localhost:8081/api/auth/introspect
