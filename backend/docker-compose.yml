version: '3.8'

services:
  # ===== NEO4J DATABASE (for Profile Service) =====
  neo4j:
    image: neo4j:5.12-community
    container_name: rescuenet-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - rescuenet-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p 12345678 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== AUTH SERVICE =====
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      # ===== NEON POSTGRES CLOUD DATABASE =====
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PARAMS: ${DB_PARAMS}
      
      # ===== SERVICE CONFIG =====
      SERVER_PORT: 8080
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
    networks:
      - rescuenet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/auth/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== PROFILE SERVICE =====
  profile-service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    container_name: profile-service
    ports:
      - "8081:8081"
    environment:
      # ===== NEO4J DATABASE (Graph Database for relationships) =====
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # ===== SERVICE CONFIG =====
      SERVER_PORT: 8081
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - rescuenet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/profile/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== API GATEWAY =====
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8888:8888"
    environment:
      # ===== SERVICE URLS (Routing configuration) =====
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PROFILE_SERVICE_URL: http://profile-service:8081
      
      # ===== CONFIG =====
      SERVER_PORT: 8888
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
    depends_on:
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - rescuenet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  neo4j_data:

networks:
  rescuenet-network:
    driver: bridge
