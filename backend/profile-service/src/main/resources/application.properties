spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:RescureNet}${DB_PARAMS:}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# = JWT CONFIGURATION
# ===============================
jwt.signerKey=${JWT_SIGNER_KEY:R3WCR9EDLLJSWqNOdxcX5lAMMOlmZEBM4Hf6h1lDZpdxjYUZRyTrQNHJxk1CVYLRksHCpjtOTfslbVLwCQMVdwFcz5FoTPDAP6yaxZkWtdLB5xxcTo7YQSoGpcSxN7Sdqr}

# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/profile

# ===============================
# = NEO4J CONFIGURATION (with environment variables)
# ===============================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=12345678

# ===============================
# = KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=profile-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=userRegistered:com.rescuenet.events.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Application name for correlation
spring.application.name=profile-service

