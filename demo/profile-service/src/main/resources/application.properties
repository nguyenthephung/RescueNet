# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/RescureNet
spring.datasource.username=postgres
spring.datasource.password=123456

# ===============================
# = JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
jwt.signerKey=R3WCR9EDLLJSWqNOdxcX5lAMMOlmZEBM4Hf6h1lDZpdxjYUZRyTrQNHJxk1CVYLRksHCpjtOTfslbVLwCQMVdwFcz5FoTPDAP6yaxZkWtdLB5xxcTo7YQSoGpcSxN7Sdqr
server.port=8081
server.servlet.context-path=/profile
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=12345678

# ===============================
# = KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=profile-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=userRegistered:com.rescuenet.events.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Application name for correlation
spring.application.name=profile-service
